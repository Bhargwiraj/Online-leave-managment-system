# ===========================
# Server Configuration
# ===========================
server.port=8080

# ===========================
# MySQL Database Configuration
# ===========================
spring.datasource.url=jdbc:mysql://localhost:3306/leave_management_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===========================
# JPA / Hibernate Configuration
# ===========================
# "update" will auto-create/update tables based on entity classes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ===========================
# JWT Configuration
# ===========================
# Secret key for signing JWT tokens (change this in production!)
jwt.secret=mySecretKey12345678901234567890123456789012345678901234567890
# Token expiration time in milliseconds (24 hours)
jwt.expiration=86400000

# ===========================
# Spring Security - Allow data.sql to run
# ===========================
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
